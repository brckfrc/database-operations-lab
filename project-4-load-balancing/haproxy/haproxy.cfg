# HAProxy — PostgreSQL read/write split (Patroni REST health-check)
#   :5000 write  -> ONLY PRIMARY (Patroni /primary -> HTTP 200)
#   :5001 read   -> ONLY REPLICA (Patroni /replica -> HTTP 200)
#   :7000 stats  -> HAProxy monitoring panel
# Patroni REST: each node 10.10.0.x:8008  (/primary, /replica health endpoints)

global
    maxconn 200

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

# ---- Statistics panel (HTTP) ----
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# ---- WRITE: route to single primary ----
listen postgres_write
    bind *:5000
    option httpchk OPTIONS /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server node1 10.10.0.1:5432 maxconn 100 check port 8008
    server node2     10.10.0.2:5432 maxconn 100 check port 8008

# ---- READ: route to replica(s) ----
listen postgres_read
    bind *:5001
    option httpchk OPTIONS /replica
    http-check expect status 200
    balance roundrobin
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server node1 10.10.0.1:5432 maxconn 100 check port 8008
    server node2     10.10.0.2:5432 maxconn 100 check port 8008
